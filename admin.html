<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>天下取りマース 管理画面</title>
<style>
:root{--bg:#14100d;--pn:#211a14;--ln:#4a3b2a;--tx:#f1e7cf;--sub:#b9a67c;--gold:#ecd58f;--shu:#d8402b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",system-ui,sans-serif;font-size:15px;line-height:1.6;-webkit-text-size-adjust:100%;touch-action:manipulation}
header{position:sticky;top:0;z-index:5;background:#0d0a08;border-bottom:1px solid var(--gold);padding:10px 12px 0}
h1{font-size:17px;margin:0 0 8px;color:var(--gold);font-weight:700}
.hd{display:flex;align-items:center;gap:8px;margin-bottom:8px}.hd h1{margin:0;flex:1;min-width:0}
#refAt{font-size:12px;color:var(--sub);white-space:nowrap}
#bRef{flex:none;padding:8px 16px;background:var(--gold);color:#14100d;font-weight:700;font-size:14px;border:0;border-radius:6px}
#bRef:disabled{opacity:.5}
#tabs{display:flex;gap:2px;overflow-x:auto}
#mapWrap{overflow:auto;max-height:72vh;background:#0b1622;border:1px solid var(--ln);border-radius:6px;-webkit-overflow-scrolling:touch}
#mapCv{display:block;image-rendering:pixelated}
#mapInfo{min-height:1.5em;margin:8px 0 0}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:13px}
#tabs button{flex:none;padding:9px 13px;background:var(--pn);color:var(--sub);border:1px solid var(--ln);border-bottom:0;border-radius:6px 6px 0 0;font-size:14px}
#tabs button.on{background:var(--gold);color:#14100d;font-weight:700}
main{padding:14px 12px 60px;max-width:860px;margin:0 auto}
button,input,select,textarea{font:inherit}
.b{padding:8px 14px;background:var(--pn);color:var(--tx);border:1px solid var(--gold);border-radius:6px;cursor:pointer}
.b.red{border-color:var(--shu);color:#ffb3a6}.b.go{background:var(--gold);color:#14100d;font-weight:700}
input,select,textarea{background:#0d0a08;color:var(--tx);border:1px solid var(--ln);border-radius:6px;padding:8px 10px;max-width:100%}
textarea{width:100%;height:80px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.box{background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:12px;margin:0 0 14px}
.box h2{font-size:15px;margin:0 0 8px;color:var(--gold)}
table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:5px 6px;border-bottom:1px solid var(--ln);text-align:left;vertical-align:top}th{color:var(--sub);font-weight:400}
td.n{text-align:right;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;border:1px solid #0008;vertical-align:-1px}
.msg{border-bottom:1px solid var(--ln);padding:8px 0}.msg small{color:var(--sub)}.msg p{margin:2px 0 4px;white-space:pre-wrap;word-break:break-word}
.gm{border-left:3px solid var(--shu);padding-left:8px}
.rooms{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}.rooms button{padding:5px 9px;font-size:13px;background:#0d0a08;color:var(--sub);border:1px solid var(--ln);border-radius:14px}.rooms button.on{background:var(--tx);color:#14100d}
#msg{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;background:#000d;border:1px solid var(--gold);padding:8px 16px;border-radius:6px;z-index:9;max-width:90vw}
small.u{font-family:monospace;color:var(--sub);font-size:11px;word-break:break-all}
</style>
</head>
<body>
<header><div class="hd"><h1>天下取りマース 管理画面</h1><span id="refAt"></span><button id="bRef" hidden>更新</button></div><div id="tabs" hidden></div></header>
<main>
 <div id="login" class="box"><h2>管理のかぎ</h2><p style="margin:0 0 8px;color:var(--sub)">Fairies' Tower・エンピツライフと同じかぎです。</p><div class="row"><input id="key" type="password" placeholder="かぎ" autocomplete="off"><button class="b go" id="bLogin">入る</button></div></div>
 <div id="view"></div>
</main>
<div id="msg" hidden></div>
<script src="js/config.js"></script>
<script src="js/mapdata.js"></script>
<script src="js/data.js"></script>
<script>
(function () {
  const TK = window.TK, M = window.TK_MAP, C = window.TK_CONFIG, DB = C.databaseURL.replace(/\/$/, ''), P = '/tk/';
  const $ = id => document.getElementById(id), esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const store = (k, v) => { try { if (v === undefined) return JSON.parse(localStorage.getItem(k) || 'null'); localStorage.setItem(k, JSON.stringify(v)); } catch (e) { return null; } };
  const T = {}; let tabNow = 'state', room = 'all', timer = 0, mapZoom = 1;
  // 名乗り（ゲームと同じ匿名ID）
  async function token(force) {
    if (!force && T.tok && Date.now() < T.exp) return T.tok;
    const sv = store('tk_auth');
    if (sv && sv.rt) { const r = await fetch('https://securetoken.googleapis.com/v1/token?key=' + C.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' }, body: 'grant_type=refresh_token&refresh_token=' + encodeURIComponent(sv.rt) }); if (r.ok) { const j = await r.json(); T.tok = j.id_token; T.exp = Date.now() + 50 * 60000; T.uid = j.user_id; store('tk_auth', { rt: j.refresh_token, uid: j.user_id }); return T.tok; } }
    const r = await fetch('https://identitytoolkit.googleapis.com/v1/accounts:signUp?key=' + C.apiKey, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: '{"returnSecureToken":true}' }); if (!r.ok) throw new Error('auth');
    const j = await r.json(); T.tok = j.idToken; T.exp = Date.now() + 50 * 60000; T.uid = j.localId; store('tk_auth', { rt: j.refreshToken, uid: j.localId }); return T.tok;
  }
  const qs = q => q ? Object.entries(q).map(([k, v]) => k + '=' + encodeURIComponent(/^(limitTo|shallow)/.test(k) ? String(v) : JSON.stringify(v))).join('&') + '&' : '';
  async function get(path, q) { const r = await fetch(DB + P + path + '.json?' + qs(q) + 'auth=' + encodeURIComponent(await token())); if (!r.ok) throw new Error('読めません（' + r.status + '）'); return r.json(); }
  async function send(method, path, val, root) { const r = await fetch(DB + (root ? '/' : P) + path + '.json?print=silent&auth=' + encodeURIComponent(await token()), { method, body: JSON.stringify(val) }); if (!r.ok) throw new Error('書けません（' + r.status + '）'); }
  const patch = o => send('PATCH', '', o);
  const SV = { '.sv': 'timestamp' }, INC = n => ({ '.sv': { increment: n } });
  const pid = () => 'G' + Date.now().toString(36) + Math.random().toString(36).slice(2, 11).padEnd(9, '0');
  const say = (m, ms) => { const e = $('msg'); e.textContent = m; e.hidden = false; clearTimeout(say.t); say.t = setTimeout(() => e.hidden = true, ms || 3000); };
  const when = t => { const d = new Date(t); return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + d.getHours() + ':' + String(d.getMinutes()).padStart(2, '0'); };
  const fn = L => TK.FI[L] ? TK.FI[L].nm[0] : (L === 'w' ? '白いマス' : L || '');
  const who = e => (e.r ? '寝返った' : '') + (TK.FI[e.h] ? TK.FI[e.h].home[0] + 'の' : '') + e.n;
  const list = v => Object.keys(v || {}).map(k => Object.assign({ id: k }, v[k])).sort((a, b) => (b.t || 0) - (a.t || 0));
  const dot = L => `<i class="dot" style="background:${TK.FI[L] ? TK.FI[L].col : '#fff'}"></i>`;
  async function login() {
    try { await token(); await send('PUT', 'ft_admins/' + T.uid, String($('key').value), true); await get('ask', { limitToLast: 1, orderBy: 't' }); store('tk_adm', 1); start(); }
    catch (e) { say('かぎが合いません'); }
  }
  function start() {
    $('login').hidden = true; $('bRef').hidden = false; $('bRef').onclick = () => refresh().then(() => say('更新しました')); const tb = $('tabs'); tb.hidden = false; tb.innerHTML = '';
    for (const [k, nm] of [['state', 'ようす'], ['map', '地図'], ['board', '掲示板'], ['ask', '質問・要望'], ['log', '記録・荒らし対応'], ['set', '設定']]) { const b = document.createElement('button'); b.textContent = nm; b.dataset.k = k; b.onclick = () => tab(k); tb.appendChild(b); }
    tab('state');
  }
  // 読みなおす（書きかけの文と、カーソルの場所は残す）
  async function refresh() {
    const keep = {}, act = document.activeElement && document.activeElement.id; $('view').querySelectorAll('textarea[id],input[id]').forEach(e => { keep[e.id] = e.value; });
    $('bRef').disabled = true; try { await render(); } finally { $('bRef').disabled = false; }
    for (const id in keep) { const e = $(id); if (e && keep[id]) e.value = keep[id]; } if (act && keep[act] !== undefined && $(act)) $(act).focus();
  }
  function tab(k) { tabNow = k; clearInterval(timer); for (const b of $('tabs').children) b.className = b.dataset.k === k ? 'on' : ''; render(); if (k === 'state' || k === 'board') timer = setInterval(refresh, 30000); }
  async function render() {
    const V = $('view');
    try {
      if (tabNow === 'state') {
        const [s, on] = await Promise.all([get('s'), get('on', { orderBy: 't', startAt: Date.now() - 150000 })]);
        const fs = TK.F.slice().sort((a, b) => (s.n[b.L] || 0) - (s.n[a.L] || 0)); const mem = TK.F.reduce((x, f) => x + ((s.m || {})[f.L] || 0), 0);
        const left = Date.UTC(2026, 10, 30, 14, 59, 59) - Date.now();
        V.innerHTML = `<div class="box"><h2>いま</h2>いま開いている人（2分半以内）：<b>${Object.keys(on || {}).length}人</b>　／　仕えた人：<b>${mem}人</b>　／　白いマス：<b>${s.n.w || 0}</b><br>終わりまで：${left > 0 ? Math.floor(left / 86400000) + '日' + Math.floor(left % 86400000 / 3600000) + '時間' : '終了'}　${s.end && s.end.k !== 'half' ? '<b style="color:#ffb3a6">天下統一：' + esc(fn(s.end.f)) + '</b>' : ''}${s.stop ? '<b style="color:#ffb3a6">　一時停止中</b>' : ''}</div>
        <div class="box"><h2>勢力</h2><table><tr><th>順</th><th>武将</th><th>マス</th><th>家臣</th></tr>${fs.map((f, i) => `<tr><td>${i + 1}</td><td>${dot(f.L)}${esc(f.nm[0])}</td><td class="n">${s.n[f.L] || 0}</td><td class="n">${(s.m || {})[f.L] || 0}</td></tr>`).join('')}</table></div>`;
      } else if (tabNow === 'map') {
        // いまの日本地図（マスの持ち主をそのまま色で出す。読みなおしは「更新」ボタンで）
        const M = window.TK_MAP, raw = await get('c'), c = []; for (let i = 0; i < M.n; i++) c[i] = (raw && raw[i]) || 'w';
        const cnt = {}; for (const L of c) cnt[L] = (cnt[L] || 0) + 1;
        const keepX = $('mapWrap') ? $('mapWrap').scrollLeft : 0, keepY = $('mapWrap') ? $('mapWrap').scrollTop : 0;
        const fs = TK.F.slice().sort((a, b) => (cnt[b.L] || 0) - (cnt[a.L] || 0));
        V.innerHTML = `<div class="box"><h2>いまの日本地図</h2><div class="row">${[1, 2, 3, 4].map(z => `<button class="b${z === mapZoom ? ' go' : ''}" data-z="${z}">${z}倍</button>`).join('')}</div><div id="mapWrap"><canvas id="mapCv"></canvas></div><p id="mapInfo" style="color:var(--sub)">マスを押すと、国と持ち主が出ます。黒いふち＝天守閣、金のふち＝名所。</p></div>
        <div class="box"><h2>色の見かた（マスの多い順）</h2><div class="lg">${fs.map(f => `<span>${dot(f.L)}${esc(f.nm[0])} ${cnt[f.L] || 0}</span>`).join('')}<span><i class="dot" style="background:#efe6d0"></i>白いマス ${cnt.w || 0}</span></div></div>`;
        const cv = $('mapCv'), P = 6, g = cv.getContext('2d'); cv.width = M.W * P; cv.height = M.H * P; cv.style.width = (100 * mapZoom) + '%';
        g.fillStyle = '#0b1622'; g.fillRect(0, 0, cv.width, cv.height);
        for (let i = 0; i < M.n; i++) { g.fillStyle = TK.FI[c[i]] ? TK.FI[c[i]].col : '#efe6d0'; g.fillRect(M.cells[2 * i] * P, M.cells[2 * i + 1] * P, P - 1, P - 1); }
        g.lineWidth = 1; g.strokeStyle = '#e8c35a'; for (const l of M.lm) for (const i of l.c) g.strokeRect(M.cells[2 * i] * P + .5, M.cells[2 * i + 1] * P + .5, P - 2, P - 2);
        for (const L in M.castle) { const i = M.castle[L], x = M.cells[2 * i] * P, y = M.cells[2 * i + 1] * P; g.fillStyle = '#000'; g.fillRect(x - 1, y - 1, P + 1, P + 1); g.fillStyle = TK.FI[L].col; g.fillRect(x + 1, y + 1, P - 3, P - 3); }
        $('mapWrap').scrollLeft = keepX; $('mapWrap').scrollTop = keepY;
        const at = new Map(); for (let i = 0; i < M.n; i++) at.set(M.cells[2 * i] + ',' + M.cells[2 * i + 1], i);
        const lmOf = {}; for (const l of M.lm) for (const i of l.c) lmOf[i] = l.n[0]; const csOf = {}; for (const L in M.castle) csOf[M.castle[L]] = L;
        cv.onclick = e => { const r = cv.getBoundingClientRect(), i = at.get(Math.floor((e.clientX - r.left) / r.width * M.W) + ',' + Math.floor((e.clientY - r.top) / r.height * M.H)); if (i === undefined) return;
          const pv = M.provs[M.prov[i]]; $('mapInfo').innerHTML = `<b style="color:var(--gold)">${esc(Array.isArray(pv) ? pv[0] : pv)}</b>　持ち主：${dot(c[i])}${esc(fn(c[i]))}${csOf[i] ? '　（' + esc(fn(csOf[i])) + 'の天守閣）' : ''}${lmOf[i] ? '　名所：' + esc(lmOf[i]) : ''}　<span style="color:var(--sub)">マス番号 ${i}</span>`; };
        V.querySelectorAll('[data-z]').forEach(b => b.onclick = () => { mapZoom = +b.dataset.z; cv.style.width = (100 * mapZoom) + '%'; V.querySelectorAll('[data-z]').forEach(x => x.className = 'b' + (+x.dataset.z === mapZoom ? ' go' : '')); });
      } else if (tabNow === 'board') {
        // 三つ巴（11/24）のあとは、全体と3軍の軍議だけを出す（合流した家の軍議は出さない。書きこみは残っている）
        const mg = await get('s/mg').catch(() => null), RM = mg ? TK.F.filter(f => mg[f.L] === f.L) : TK.F;
        if (room !== 'all' && !RM.some(f => f.L === room)) room = 'all';
        const [v, pv] = await Promise.all([get('b/' + room, { orderBy: 't', limitToLast: 80 }).then(list), get('bp/' + room).then(x => x || {})]);
        const pins = Object.entries(pv).map(([id, e]) => Object.assign({ id }, e)).sort((a, b) => b.t - a.t);
        // 遊ぶ画面に自動で出るお知らせ（時間割から作る。データベースには入っていない）。今日の分を、遊ぶ画面と同じ文で出す
        const auto = [];
        { const DAYM = 86400000, JST = 9 * 3600000, now = Date.now(), d = Math.floor((now + JST) / DAYM) * DAYM - JST, x = await get('schd/' + d).catch(() => null), hs = x && x.h;
          if (hs) { const H = i => i + '時', nm = L => fn(L);
            if (room === 'all') {
              const li = []; for (let i = 0; i < 24; i++) if (hs[i] !== '*' && hs[i] !== '-') li.push(H(i) + ' ' + nm(hs[i]));
              auto.push({ t: d, top: 1, m: `お知らせ：本日の早取りの時間割です（日本時間）。${li.join('、')}。それぞれの番の1時間は、その陣営だけ2分で1マス取れます。0時・6時・12時・18時からの1時間は、全陣営が5分で1マスです。` });
              for (let i = 0; i < 24; i++) { const a = d + i * 3600000; if (a > now) break; if (now >= a + 3600000 || hs[i] !== '*') continue; auto.push({ t: a + 1, m: `お知らせ：ただいま全陣営の早取りの時間です（${H(i + 1)}まで）。どの陣営も5分で1マス取れます。` }); }
            } else {
              const ix = []; for (let i = 0; i < 24; i++) if (hs[i] === room) ix.push(i);   // 三つ巴のあとは1日2回
              if (ix.length) { auto.push({ t: d, top: 1, m: ix.length === 1 ? `お知らせ：本日の当家の番は${H(ix[0])}〜${H(ix[0] + 1)}。この1時間は2分で1マス取れる。皆の者、備えよ！` : `お知らせ：本日の当軍の早取りの番は${ix.map(i => H(i) + '〜' + H(i + 1)).join('、')}。この間は2分で1マス取れる。皆の者、備えよ！` });
                for (const i of ix) { const a = d + i * 3600000; if (a <= now && now < a + 3600000) auto.push({ t: a + 1, m: `お知らせ：ただいま当家の番！ ${H(i + 1)}まで2分で1マス取れる。いざ出陣！` }); } }
            } } }
        // 奇襲（11/26）：奇襲の30分のあいだだけ、その2軍の軍議の一番上に出る（遊ぶ画面と同じ）
        if (room !== 'all') { const DAYM = 86400000, JST = 9 * 3600000, now = Date.now(), d = Math.floor((now + JST) / DAYM) * DAYM - JST, kd = (await get('kid/' + d).catch(() => null)) || {}, an = L => fn(L) + '軍', hm = ts => { const x = new Date(ts + JST); return x.getUTCHours() + ':' + String(x.getUTCMinutes()).padStart(2, '0'); };
          for (const v of Object.values(kd)) if (v && v.a <= now && now < v.a + 1800000 && (v.f === room || v.g === room)) auto.unshift({ t: v.a, top: 1, ki: 1, m: v.f === room ? `【奇襲】好機到来！ ${hm(v.a + 1800000)}まで、${an(v.g)}のマスは1分で取れる。討て！` : `【奇襲】${an(v.f)}が奇襲をしかけてきた！ ${hm(v.a + 1800000)}まで、敵は当軍のマスを1分で奪える。守れ！` }); }
        const autoTop = auto.filter(e => e.top), autoFlow = auto.filter(e => !e.top);
        v.forEach(e => { if (e.t > Date.now()) e.m = '（' + new Date(e.t + 9 * 3600000).toISOString().slice(11, 16) + 'に出る予約）' + e.m; });   // 奇襲など、時刻つきで先に書いたお知らせ
        const vv = v.concat(autoFlow.map(e => Object.assign({ auto: 1, g: true }, e))).sort((a, b) => b.t - a.t);
        V.innerHTML = `<div class="rooms">${[['all', '全体']].concat(RM.map(f => [f.L, f.nm[0]])).map(([r, nm]) => `<button data-r="${r}" class="${r === room ? 'on' : ''}">${esc(nm)}</button>`).join('')}</div>
        <div class="box"><h2>なすPとして書く（${esc(room === 'all' ? '全体' : fn(room) + '軍の軍議')}）</h2><textarea id="gmM" maxlength="100" placeholder="100文字まで"></textarea><div class="row"><button class="b go" id="gmS">この板に書く</button><button class="b" id="gmAll">全部の板（全体＋${RM.length}陣営）に書く</button></div></div>
        <div class="box"><h2>📌 ピン止め中（遊んでいる人の掲示板の一番上に出ます・${pins.length}件）</h2>${autoTop.map(e => `<div class="msg gm"><small>${when(e.t)}　なすP（${e.ki ? '自動・奇襲中だけ出ます' : '自動・今日の時間割。0時に入れかわります。外せません'}）</small><p>${esc(e.m)}</p></div>`).join('')}${pins.map(e => `<div class="msg${e.g ? ' gm' : ''}"><small>${when(e.t)}　${e.g ? 'なすP' : dot(e.f) + esc(who(e))}</small><p>${esc(e.m)}</p><button class="b" data-unpin="${e.id}">ピン止めを外す</button></div>`).join('') || '自分でピン止めした書きこみはありません（下の書きこみの「📌 ピン止め」で固定できます）'}</div>
        <div class="box"><h2>書きこみ（新しい順・${v.length}件）</h2>${vv.map(e => e.auto ? `<div class="msg gm"><small>${when(e.t)}　なすP（自動・番の時間の間だけ出ます）</small><p>${esc(e.m)}</p></div>` : `<div class="msg${e.g ? ' gm' : ''}"><small>${when(e.t)}　${e.g ? 'なすP' : dot(e.f) + esc(who(e)) + '（' + esc(fn(e.f)) + '軍）'}</small><p>${esc(e.m)}</p>${pv[e.id] ? '<b style="color:#b8902f">📌 ピン止め中</b> ' : `<button class="b" data-pin="${e.id}">📌 ピン止め</button> `}<button class="b red" data-del="${e.id}">消す</button> ${e.g ? '' : `<button class="b red" data-ban="${esc(e.u)}">この人を書きこめなくする</button> <small class="u">${esc(e.u)}</small>`}</div>`).join('') || 'まだありません'}</div>`;
        V.querySelectorAll('[data-r]').forEach(b => b.onclick = () => { room = b.dataset.r; render(); });
        const post = async rooms => { const m = $('gmM').value.trim(); if (!m) return; const o = {}; for (const r of rooms) o['b/' + r + '/' + pid()] = { t: SV, u: T.uid, n: 'なすP', m: m.slice(0, 100), g: true }; await patch(o); say('書きました'); render(); };
        $('gmS').onclick = () => post([room]).catch(e => say(e.message)); $('gmAll').onclick = () => { if (confirm('全部の板（' + (RM.length + 1) + 'か所）に書きます。よいですか？')) post(['all'].concat(RM.map(f => f.L))).catch(e => say(e.message)); };
        V.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { if (!confirm('この書きこみを消しますか？')) return; await patch({ ['b/' + room + '/' + b.dataset.del]: null, ['bp/' + room + '/' + b.dataset.del]: null }); render(); });
        V.querySelectorAll('[data-pin]').forEach(b => b.onclick = async () => { const e = v.find(x => x.id === b.dataset.pin); if (!e) return; const o = {}; for (const k of ['t', 'n', 'm', 'g', 'f', 'h', 'r']) if (e[k] !== undefined) o[k] = e[k]; await patch({ ['bp/' + room + '/' + e.id]: o }); say('ピン止めしました'); render(); });
        V.querySelectorAll('[data-unpin]').forEach(b => b.onclick = async () => { await patch({ ['bp/' + room + '/' + b.dataset.unpin]: null }); say('ピン止めを外しました'); render(); });
        V.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => ban(b.dataset.ban));
      } else if (tabNow === 'ask') {
        const v = list(await get('ask', { orderBy: 't', limitToLast: 100 }));
        V.innerHTML = `<div class="box"><h2>なすPへの質問・要望（新しい順・${v.length}件）</h2>${v.map(e => `<div class="msg"><small>${when(e.t)}　${esc(e.n || '（仕える前）')}　ことば：${esc(e.l)}${e.x ? `　X：<a href="https://x.com/${esc(e.x)}" target="_blank" style="color:var(--gold)">@${esc(e.x)}</a>` : ''}</small><p>${esc(e.m)}</p><button class="b red" data-del="${e.id}">消す</button></div>`).join('') || 'まだありません'}</div>`;
        V.querySelectorAll('[data-del]').forEach(b => b.onclick = async () => { await patch({ ['ask/' + b.dataset.del]: null }); render(); });
      } else if (tabNow === 'log') {
        const v = list(await get('log', { orderBy: 't', limitToLast: 150 })); const cnt = {}; for (const e of v) if (e.u) cnt[e.u] = (cnt[e.u] || 0) + 1;
        // 早取り（11/17）に合わせた「早すぎ」の見分け：取った時刻の番が自分の陣営なら2分、全陣営の時間なら5分、ほかは1時間あいていればよい
        const DAYM = 86400000, JST = 9 * 3600000, day = t => Math.floor((t + JST) / DAYM) * DAYM - JST, sch = {};
        const xs = {}, rice = {}, gks = {}, kis = {};   // kis：その日の奇襲（30分、仕掛けた軍は相手のマスを1分）   // gks：その日の下剋上の軍（早取りが半分）
        await Promise.all([...new Set(v.map(e => day(e.t)))].map(d => Promise.all([get('schd/' + d).then(x => { if (x && x.h) { sch[d] = x.h; xs[d] = x.x || {}; } }).catch(() => { }), get('rice/' + d).then(x => { rice[d] = x || {}; }).catch(() => { }), get('gk/' + d).then(x => { gks[d] = x || ''; }).catch(() => { }), get('kid/' + d).then(x => { kis[d] = Object.values(x || {}); }).catch(() => { })])));
        // 兵糧の士気（その日の最後の数で見るので、甘めの判定）：3・7・12俵で50・40・30分
        const need = e => { const d = day(e.t), h = sch[d], i = Math.floor((e.t - d) / 3600000); const L = h ? h[i] : ''; if ((kis[d] || []).some(v => v && e.t >= v.a && e.t < v.a + 1800000 && v.f === e.f && v.g === e.p)) return 60000; const k = gks[d] && gks[d] === e.f ? 0.5 : 1; if (L === e.f || (xs[d] && xs[d][i] === e.f)) return 120000 * k; if (L === '*') return 300000 * k; const n = +((rice[d] || {})[e.f]) || 0; return 3600000 - (n >= 12 ? 3 : n >= 7 ? 2 : n >= 3 ? 1 : 0) * 600000; };
        const prevT = {}, fast = {};
        for (const e of v.slice().sort((a, b) => a.t - b.t)) { if (e.y !== 't' || !e.u) continue; if (prevT[e.u] && e.t - prevT[e.u] < need(e) - 5000) fast[e.id] = Math.round((e.t - prevT[e.u]) / 1000); prevT[e.u] = e.t; }
        const nFast = Object.keys(fast).length;
        const bans = await get('ban').catch(() => null);
        V.innerHTML = `<div class="box"><h2>マスを直す</h2><div class="row">マス番号 <input id="fxC" inputmode="numeric" style="width:90px"> を <select id="fxF"><option value="w">白いマス</option>${TK.F.map(f => `<option value="${f.L}">${esc(f.nm[0])}</option>`).join('')}</select> のものにする <button class="b" id="fxGo">直す</button></div><div class="row"><button class="b" id="fxCount">マスの数を数えなおす</button><span style="color:var(--sub);font-size:13px">（地図と数字がずれたとき）</span></div></div>
        <div class="box"><h2>書きこめなくした人</h2>${Object.keys(bans || {}).map(u => `<div class="row"><small class="u">${esc(u)}</small><button class="b" data-unban="${esc(u)}">もどす</button></div>`).join('') || 'いません'}</div>
        <div class="box"><h2>記録（新しい順・150件）</h2><p style="margin:0 0 8px;color:var(--sub);font-size:13px">ふつうは1時間に1マス（兵糧で士気が上がった陣営は50・40・30分）。早取りの時間は、番の陣営が2分・全陣営の時間（0・6・12・18時）は5分で1マスまで取れます。それより早く取っていたら「⚠ 早すぎ」と出ます（この150件の中で ${nFast}件）。</p><table><tr><th>時刻</th><th>だれが</th><th>何を</th><th></th></tr>${v.map(e => `<tr><td>${when(e.t)}</td><td>${dot(e.f)}${esc(who(e))}<br><small class="u">${esc((e.u || '').slice(0, 10))}（この中で${cnt[e.u] || 0}回）</small>${fast[e.id] != null ? `<br><b style="color:#e0582a">⚠ 早すぎ（前の1マスから${fast[e.id] >= 60 ? Math.floor(fast[e.id] / 60) + '分' : fast[e.id] + '秒'}）</b>` : ''}</td><td>${e.y === 'd' ? esc(fn(e.p)) + ' → ' + esc(fn(e.f)) + ' へ寝返り' : 'マス' + esc(e.c) + '（' + esc(M.provs[M.prov[+e.c]]) + '）を ' + esc(fn(e.p)) + ' から'}</td><td>${e.y === 't' ? `<button class="b" data-back="${esc(e.c)}|${esc(e.p)}">もどす</button> ` : ''}${e.u ? `<button class="b red" data-ban="${esc(e.u)}">止める</button>` : ''}</td></tr>`).join('')}</table></div>`;
        const fix = async (c, to) => { c = String(+c); if (!(+c >= 0 && +c < M.n)) return say('マス番号がちがいます'); const cur = await get('c/' + c); if (cur === to) return say('もうそうなっています'); const s = await get('s'); await patch({ ['c/' + c]: to, ['s/n/' + to]: (s.n[to] || 0) + 1, ['s/n/' + cur]: Math.max(0, (s.n[cur] || 0) - 1), 's/ver': (s.ver || 0) + 1 }); say('直しました'); render(); };
        $('fxGo').onclick = () => fix($('fxC').value, $('fxF').value).catch(e => say(e.message));
        $('fxCount').onclick = async () => { const c = await get('c'), s = await get('s'), n = { w: 0 }; for (const f of TK.F) n[f.L] = 0; for (let i = 0; i < M.n; i++) n[(c && c[i]) || M.own[i]]++; await patch({ 's/n': n, 's/ver': (s.ver || 0) + 1 }); say('数えなおしました'); };
        V.querySelectorAll('[data-back]').forEach(b => b.onclick = () => { const [c, p] = b.dataset.back.split('|'); if (confirm('マス' + c + ' を ' + fn(p) + ' にもどしますか？')) fix(c, p).catch(e => say(e.message)); });
        V.querySelectorAll('[data-ban]').forEach(b => b.onclick = () => ban(b.dataset.ban));
        V.querySelectorAll('[data-unban]').forEach(b => b.onclick = async () => { await patch({ ['ban/' + b.dataset.unban]: null }); render(); });
      } else if (tabNow === 'set') {
        const s = await get('s');
        V.innerHTML = `<div class="box"><h2>お知らせ（タイトルと地図の上に出ます。300文字まで）</h2><textarea id="pin" maxlength="300">${esc(s.pin || '')}</textarea><div class="row"><button class="b go" id="pinS">出す</button><button class="b" id="pinX">消す</button></div></div>
        <div class="box"><h2>読みなおしの間隔（人が増えて通信が多くなったら、長くする）</h2>いま：<b>${s.pi || 30}秒</b>ごとに、みんなの画面が地図を読みなおします。<div class="row">${[30, 60, 120, 300].map(v => `<button class="b" data-pi="${v}">${v}秒</button>`).join('')}</div><span style="color:var(--sub);font-size:13px">変えてから、みんなの画面に届くまで5分ほどかかります。</span></div>
        <div class="box"><h2>一時停止（マスを取れなくする）</h2>いま：<b>${s.stop ? '止めています' : '動いています'}</b><div class="row"><button class="b red" id="stopOn">止める</button><button class="b" id="stopOff">再開する</button></div></div>
        <div class="box"><h2>終わり</h2>いま：<b>${s.end && s.end.k !== 'half' ? esc(fn(s.end.f)) + ' が天下統一（' + when(s.end.t) + '）' : 'まだ終わっていません（毎日24時に4000マス以上の軍が天下統一）'}</b><br><span style="color:var(--sub);font-size:13px">2500マスに届くと自動で終わります。11/30 23:59 を過ぎても自動で終わります。</span>${s.end ? '<div class="row"><button class="b red" id="endX">終わりを取り消す（まちがって終わったとき）</button></div>' : ''}</div>`;
        V.querySelectorAll('[data-pi]').forEach(b => b.onclick = async () => { await send('PUT', 's/pi', +b.dataset.pi); say('変えました'); render(); });
        $('pinS').onclick = async () => { await send('PUT', 's/pin', $('pin').value.slice(0, 300)); say('出しました'); }; $('pinX').onclick = async () => { await patch({ 's/pin': null }); say('消しました'); render(); };
        $('stopOn').onclick = async () => { if (confirm('マスを取れなくします。よいですか？')) { await send('PUT', 's/stop', true); render(); } }; $('stopOff').onclick = async () => { await patch({ 's/stop': null }); render(); };
        if ($('endX')) $('endX').onclick = async () => { if (confirm('終わりを取り消します。よいですか？')) { await patch({ 's/end': null }); render(); } };
      }
      const d = new Date(), z = n => String(n).padStart(2, '0'); $('refAt').textContent = z(d.getHours()) + ':' + z(d.getMinutes()) + ':' + z(d.getSeconds()) + ' 時点';
    } catch (e) { V.innerHTML = '<div class="box">' + esc(e.message) + '</div>'; }
  }
  async function ban(u) { if (!u || !confirm('この人を、マスを取れず・板にも書けなくします。よいですか？\n' + u)) return; try { await send('PUT', 'ban/' + u, true); say('止めました'); render(); } catch (e) { say(e.message); } }
  $('bLogin').onclick = login; $('key').onkeydown = e => { if (e.key === 'Enter') login(); };
  if (store('tk_adm')) token().then(() => get('ask', { limitToLast: 1, orderBy: 't' })).then(start).catch(() => { });
})();
</script>
</body>
</html>

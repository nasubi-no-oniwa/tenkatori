<style>
:root{--lac:#14100d;--lac2:#241a13;--gold:#c9a44c;--gold2:#ecd58f;--paper:#f1e7cf;--paper2:#e3d3ac;--ink:#241b14;--sub:#6e5b45;--shu:#c8321f;--shu2:#9c2314;
 --ft:"Yuji Syuku","Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP","Songti TC","Nanum Myeongjo",serif;
 --fb:"Shippori Mincho B1","Hiragino Mincho ProN","Yu Mincho","Noto Serif CJK JP","Noto Serif JP","Songti TC","Nanum Myeongjo","AppleMyungjo",serif;
 --st:env(safe-area-inset-top,0px);--sb:env(safe-area-inset-bottom,0px);
 --washi:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .36  0 0 0 0 .26  0 0 0 0 .12  0 0 0 .1 0'/></filter><rect width='220' height='220' filter='url(%23n)'/></svg>")}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--lac);color:var(--paper);font-family:var(--fb);overflow:hidden;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;overscroll-behavior:none;touch-action:manipulation;font-feature-settings:"palt"}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0;touch-action:manipulation}
input,textarea{font:inherit;user-select:text;-webkit-user-select:text}
canvas{display:block}
#gl,#map,#fx{position:fixed;inset:0;width:100%;height:100%}

.over{position:fixed;inset:0;z-index:30}
.paper{background:var(--paper) var(--washi);color:var(--ink);border:1px solid #8b7550;box-shadow:0 0 0 4px var(--paper),0 0 0 5px #8b7550,0 18px 40px rgba(0,0,0,.5)}

.btn.main:active{box-shadow:0 0 0 #5c1209}
.btn.x{background:#111;color:#fff;border-color:#000;box-shadow:0 3px 0 #000;font-size:15px}
.btn.sm{min-height:42px;font-size:14.5px;padding:8px 8px}

.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lnk{color:var(--gold2);font-size:14px;padding:8px 6px;font-weight:700}
/* ---------- タイトル ---------- */
#title{overflow-y:auto;-webkit-overflow-scrolling:touch}

.logo{position:relative;flex:1 0 auto;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:10px 0 18px;pointer-events:none;min-height:46vh}
.logo h1{margin:0;font-family:var(--ft);font-weight:400;line-height:.98;color:#fff5dc;text-shadow:0 2px 0 #000,0 0 26px rgba(0,0,0,.9),0 0 60px rgba(201,164,76,.35)}
.logo h1 span{display:block;font-size:clamp(58px,19vw,104px);letter-spacing:.04em}
.logo h1 b{display:inline-block;font-weight:400;font-size:clamp(46px,15vw,82px);color:var(--gold2);letter-spacing:.1em;margin-top:.06em;position:relative}
.logo h1 b::after{content:"一マス";position:absolute;right:-3.5em;top:-.3em;width:2.9em;height:2.9em;font-size:.2em;font-family:var(--fb);font-weight:800;line-height:1.15;letter-spacing:0;color:#fff3da;background:var(--shu);border-radius:5px;display:grid;place-items:center;padding:.2em .5em;box-shadow:inset 0 0 0 2px rgba(255,243,218,.75),0 2px 8px rgba(0,0,0,.5);transform:rotate(7deg);text-shadow:none;writing-mode:vertical-rl}
.logo p{margin:16px 0 0;font-size:15px;letter-spacing:.14em;color:#e9dcbc;text-shadow:0 1px 6px #000,0 0 14px #000;font-weight:700}

#title div.card{width:min(100%,380px);background:rgba(20,16,13,.78);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid rgba(201,164,76,.55);box-shadow:0 0 0 4px rgba(20,16,13,.78),0 0 0 5px rgba(201,164,76,.35),0 20px 50px rgba(0,0,0,.6);padding:16px 11px 18px;display:flex;flex-direction:column;gap:11px}

#title .btn:not(.main){background:#efe4c8 var(--washi)}
#title .btn.ghost{background:transparent;border-color:rgba(236,213,143,.4);color:#d9c79b}
.logo::before{content:"";position:absolute;left:-16px;right:-16px;top:-40px;bottom:-30px;background:radial-gradient(70% 55% at 50% 52%,rgba(11,8,6,.72),rgba(11,8,6,.35) 60%,rgba(11,8,6,0) 100%);z-index:-1}
/* ---------- 診断 ---------- */

#reveal{overflow-y:auto;-webkit-overflow-scrolling:touch}
.rv{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:calc(var(--st) + 16px) 16px calc(var(--sb) + 20px);text-align:center}
#rvYou{font-size:14px;letter-spacing:.4em;color:var(--gold2);text-shadow:0 1px 8px #000}
#rvType{font-family:var(--ft);font-size:clamp(25px,7.4vw,36px);line-height:1.35;margin-top:6px;color:#fff5dc;text-shadow:0 2px 12px #000,0 0 30px #000;max-width:15em}
.rvmid{flex:1 0 34vh;min-height:230px;pointer-events:none}
.rvbox{width:min(100%,400px);padding:16px 16px 18px;display:flex;flex-direction:column;gap:10px}
#rvServe{font-family:var(--ft);font-size:27px;line-height:1.3}
#rvDesc{font-size:14.5px;line-height:1.75;color:#4a3b2c;font-weight:500;text-align:left}

#rvNote{font-size:11.5px;color:var(--sub);text-align:left}

/* ---------- 地図の画面 ---------- */
#hud{position:fixed;left:0;right:0;top:0;z-index:10;display:flex;align-items:stretch;gap:8px;padding:calc(var(--st) + 7px) 10px 8px;background:linear-gradient(#1b1510,#14100d);border-bottom:1px solid var(--gold);box-shadow:0 1px 0 #000,0 6px 18px rgba(0,0,0,.45)}

#hudTimer.ready #hudT{font-family:var(--ft);font-weight:400;font-size:16px;color:#fff3da;background:var(--shu);padding:6px 9px;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(255,243,218,.6);animation:rdy 1.6s ease-in-out infinite;text-align:center}
@keyframes rdy{50%{filter:brightness(1.25)}}
#fastBar{position:fixed;left:8px;top:calc(var(--st) + 100px);z-index:9;max-width:calc(100% - 16px);font:inherit;font-size:12.5px;font-weight:800;letter-spacing:.03em;line-height:1.4;padding:5px 12px;background:rgba(20,16,13,.88);color:#f3e7c9;border:1px solid rgba(201,164,76,.7);border-radius:15px;text-align:left;cursor:pointer}
#fastBar.hot{background:linear-gradient(90deg,#b8261a,#e0582a);color:#fff;border-color:#ffd27a;box-shadow:0 0 0 2px rgba(255,210,122,.35),0 4px 14px rgba(224,88,42,.5);animation:fsPulse 1.6s ease-in-out infinite}

#pinBar.low{top:calc(var(--st) + 134px)}
.fsRow{display:flex;align-items:center;gap:10px;padding:7px 6px;border-bottom:1px solid rgba(110,91,69,.25)}
.fsRow b{flex:none;width:92px;font-variant-numeric:tabular-nums;font-size:14px}
.fsRow canvas{flex:none;width:30px;height:30px}
.fsRow i{flex:none;width:30px;text-align:center;font-style:normal;font-size:18px}
.fsRow span{flex:1;font-weight:700}
.fsRow em{flex:none;font-style:normal;font-size:12px;color:var(--sub)}
.fsRow.past{opacity:.45}
.fsRow.me{background:rgba(201,164,76,.16)}
.fsRow.cur{background:rgba(200,50,31,.14);box-shadow:inset 3px 0 0 var(--shu)}
#pinBar{position:fixed;left:8px;right:8px;top:calc(var(--st) + 100px);z-index:9;font-size:12.5px;line-height:1.5;padding:6px 10px;background:rgba(20,16,13,.86);color:#f3e7c9;border-left:3px solid var(--shu);white-space:pre-wrap;max-height:3.6em;overflow:hidden}
#telop{position:fixed;left:0;right:0;top:calc(var(--st) + 112px);z-index:44;pointer-events:none;text-align:center;padding:13px 16px;background:linear-gradient(90deg,rgba(20,16,13,0),rgba(20,16,13,.95) 10%,rgba(20,16,13,.95) 90%,rgba(20,16,13,0));border-top:1px solid var(--gold);border-bottom:1px solid var(--gold);font-family:var(--ft);font-size:clamp(19px,5.7vw,27px);color:#fff5dc;line-height:1.4;text-shadow:0 2px 6px #000}
#telop b{color:var(--gold2);font-weight:400}
#telop.lost{border-color:#8a8d93;color:#d8d2c2}#telop.lost b{color:#fff}
#keyBar{position:fixed;left:8px;top:calc(var(--st) + 66px);z-index:9;font-size:12px;font-weight:800;letter-spacing:.04em;padding:4px 11px 4px 5px;background:rgba(20,16,13,.9);color:#fff3da;border:1px solid var(--shu);border-radius:15px;display:flex;align-items:center;gap:6px;box-shadow:0 3px 10px rgba(0,0,0,.35)}
#keyIc{width:22px;height:22px}
#cellLm{font-size:12.5px;font-weight:800;color:#7a5a12;border-top:1px dashed #a08b66;padding-top:7px;text-align:left}
.lmRow{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:9px;padding:7px 4px;border-bottom:1px dotted #a8946c}
.lmRow canvas{width:34px;height:34px}.lmRow .nm{font-weight:800;font-size:14.5px;line-height:1.25}.lmRow .nm small{display:block;font-weight:500;font-size:11px;color:var(--sub)}
.lmRow .st{font-size:12.5px;font-weight:800;text-align:right;display:flex;align-items:center;gap:6px;justify-content:flex-end}.lmRow .st canvas{width:24px;height:24px}
.lmRow .st.no{color:var(--sub);font-weight:500}
#zoom{position:fixed;right:10px;bottom:calc(var(--sb) + 84px);z-index:9;display:flex;flex-direction:column;gap:7px}
#zoom button{width:42px;height:42px;border-radius:50%;background:rgba(20,16,13,.88);color:var(--gold2);border:1px solid var(--gold);font-size:21px;line-height:1;box-shadow:0 3px 10px rgba(0,0,0,.4);font-family:var(--fb);font-weight:700}
#zoom button:active{background:#000}
#zLm{font-family:var(--ft)!important;font-weight:400!important;font-size:18px!important}#zLm.off{color:#7d6f55!important;border-color:#5a4d38!important;text-decoration:line-through}
#nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:grid;grid-template-columns:repeat(6,1fr);padding:6px 4px calc(var(--sb) + 6px);background:linear-gradient(#1b1510,#14100d);border-top:1px solid var(--gold);box-shadow:0 -6px 18px rgba(0,0,0,.4)}

.cellTop{display:flex;align-items:center;gap:11px}

#cellProv{font-family:var(--ft);font-size:21px;line-height:1.2}
#cellOwner{font-size:13px;color:var(--sub);margin-top:2px;font-weight:700}
#cellX{flex:none;width:34px;height:34px;font-size:18px;color:var(--sub)}
#cellWhy{font-size:13.5px;font-weight:800;color:var(--shu2);text-align:center;padding:3px 0}
/* ---------- マスを取ったあとの画面（結果画面） ---------- */
/* 巻物 */
#scroll{display:flex;flex-direction:column;z-index:33;padding-top:var(--st);background:radial-gradient(120% 80% at 50% 0%,#2c2219,#14100d 70%)}
#scroll[hidden]{display:none}
.scAd{flex:none;min-height:0}

.pAdW:not(:has(.nsb-ad)),#panel:not([data-ad]) .pAdW{display:none}
.scHd{flex:none;display:flex;align-items:center;gap:6px;padding:8px 8px 7px 6px;border-bottom:1px solid rgba(201,164,76,.45)}

#scPick canvas{width:40px;height:40px;display:block}
#scX{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--gold);color:var(--gold2);font-size:17px;background:#17110c}
#scBody{flex:1;min-height:0;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;padding:14px 10px calc(var(--sb) + 18px);user-select:text;-webkit-user-select:text}
#scBody.v{writing-mode:vertical-rl;overflow-y:hidden;overflow-x:auto;padding:14px 12px calc(var(--sb) + 14px)}
.maki{display:flex;flex-direction:column;align-items:stretch;padding-block-end:16px}
.tcy{text-combine-upright:all;-webkit-text-combine:horizontal}

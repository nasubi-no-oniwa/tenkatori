# データベースのルールを GitHub に上げると、自動で ft-blue に反映する（ほかのゲームのルールはそのまま残す）
#  順番：にせのデータベースで試験 → 反映 → 本物のデータベースの試験用の場所で同じ試験 → 最初の地図を入れる（まだないときだけ）
name: データベースのルールを反映
on:
  push:
    branches: [main]
    paths:
      - 'database.rules.tk.json'
      - 'data/map.json'
      - 'tools/**'
      - 'test/**'
      - '.github/workflows/rules.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tk-rules
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: ルールの試験（にせのデータベースで）
        run: node test/rules-test.mjs
      - name: 道具を入れる
        run: mkdir -p "$RUNNER_TEMP/x" && cd "$RUNNER_TEMP/x" && npm init -y >/dev/null && npm i google-auth-library@9 --silent
      - name: 鍵を一時ファイルに書く
        env:
          SA: ${{ secrets.FT_BLUE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "FT_BLUE_SERVICE_ACCOUNT が登録されていません"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: ルールを反映
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node tools/deploy-rules.mjs
      - name: 本物のデータベースで試験（試験用の場所 tkt）
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node tools/e2e.mjs
      - name: 最初の地図を入れる（まだないときだけ）
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: node tools/seed.mjs
      - name: 鍵を消す
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
